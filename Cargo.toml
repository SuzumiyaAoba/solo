[package]
name = "solo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Rust + GPUI agent workspace — Phase 0"
default-run = "solo"

[features]
default = ["gui"]
gui = ["dep:gpui-kit"]

[dependencies]
async-channel = "=2.5.0"
futures = "=0.3.34"
genai = { package = "genai-agentprism", version = "=0.7.0-beta.19.1-agentprism", features = ["codex-auth-resolver"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = { version = "=0.6.6", optional = true }

[[bin]]
name = "solo"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "solo-design"
path = "src/bin/solo-design.rs"
required-features = ["gui"]

[[bin]]
name = "solo-subscription"
path = "src/bin/solo-subscription.rs"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
