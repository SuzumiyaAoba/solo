name: Solo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --all-systems --no-build
      - run: nix develop .#minimal --command nixfmt --check flake.nix
      - run: nix develop .#minimal --command cargo fmt --all -- --check
      - run: nix develop .#minimal --command cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: nix develop .#minimal --command cargo test --locked --no-default-features --all-targets
  gpui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop .#minimal --command cargo clippy --locked --all-targets -- -D warnings
      - run: nix develop .#minimal --command cargo build --locked --bins
